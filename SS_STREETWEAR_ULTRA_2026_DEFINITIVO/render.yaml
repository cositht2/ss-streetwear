services:
  - type: web
    name: ss-streetwear
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn backend.app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin123
      # Obligatoria (mínimo 10 caracteres). Render te la pedirá al crear el servicio.
      - key: ADMIN_PASSWORD
        sync: false
      # Tu dominio final, sin barra al final. Ej: https://ssstreetwear.com
      - key: SITE_URL
        sync: false
      - key: ADMIN_NAME
        value: Administrador S&S
    # IMPORTANTE: en el plan gratis el disco se borra en cada reinicio/despliegue.
    # Descarga copias desde Admin → Configuración → "Descargar copia de seguridad".
    # Con un plan de pago puedes activar un disco persistente:
    # disk:
    #   name: ss-streetwear-data
    #   mountPath: /var/data
    #   sizeGB: 1
    # y añadir la variable SQLITE_DB_PATH=/var/data/ss_streetwear.db
